<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{Widget Name} — Settings</title>
<style>
/* ── Base WCP dark defaults (host overrides via CSS vars on postMessage) ── */
:root{--wcp-color-bg:#0d1117;--wcp-color-surface:#161b22;--wcp-color-surface-raised:#1c2128;--wcp-color-border:#30363d;--wcp-color-text:#e6edf3;--wcp-color-text-muted:#8b949e;--wcp-color-primary:#f0883e;--wcp-color-success:#3fb950;--wcp-color-danger:#f85149;--wcp-color-warning:#d29922;--wcp-color-info:#58a6ff;--wcp-radius-md:8px;--wcp-shadow-sm:0 4px 16px rgba(0,0,0,.45)}
*{box-sizing:border-box;margin:0;padding:0}
*::-webkit-scrollbar{width:8px}*::-webkit-scrollbar-track{background:var(--wcp-color-surface)}*::-webkit-scrollbar-thumb{background:var(--wcp-color-border);border-radius:4px}
html,body{height:100%;background:var(--wcp-color-bg);color:var(--wcp-color-text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px}
.wrap{height:100%;overflow-y:auto;padding:12px}
.section{background:var(--wcp-color-surface);border:1px solid var(--wcp-color-border);border-radius:var(--wcp-radius-md);padding:14px 16px;margin-bottom:12px}
.section h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--wcp-color-text-muted);margin-bottom:12px}
.field{margin-bottom:12px}.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--wcp-color-text-muted);margin-bottom:5px}
.hint{font-size:11px;color:var(--wcp-color-text-muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:6px;border:1px solid var(--wcp-color-border);background:var(--wcp-color-surface-raised);color:var(--wcp-color-text);font-size:12px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--wcp-color-primary);color:var(--wcp-color-primary)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--wcp-color-primary);border-color:var(--wcp-color-primary);color:#fff}
.btn.primary:hover{opacity:.88}
/* Theme list */
.theme-list-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin-bottom:4px;transition:background .12s}
.theme-list-item:hover{background:var(--wcp-color-surface-raised)}
.theme-list-item.active-theme{border-color:var(--wcp-color-border);background:var(--wcp-color-surface-raised)}
.theme-list-item input[type=radio]{accent-color:var(--wcp-color-primary);flex-shrink:0;cursor:pointer}
.theme-name{flex:1;font-size:12px}
.theme-builtin-badge{font-size:10px;color:var(--wcp-color-text-muted);background:var(--wcp-color-surface-raised);border:1px solid var(--wcp-color-border);border-radius:4px;padding:1px 5px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ── {Widget Name} card ───────────────────────────────────────── -->
  <div class="section">
    <h2>{Widget Name}</h2>
    <div class="field">
      <label>Port</label>
      <div style="font-size:12px;color:var(--wcp-color-text)">{{ port }}</div>
      <div class="hint">Manifest URL: http://localhost:{{ port }}/widget/wcp</div>
    </div>
    <!-- Add widget-specific configuration fields here -->
  </div>

  <!-- ── Theme card ─────────────────────────────────────────────────
       IMPORTANT: Include this section only if this widget acts as a
       "Settings" widget that should control the dashboard theme.
       Most domain widgets should NOT include theme management.
  ── -->
  <div class="section">
    <h2>Theme</h2>
    <div class="field">
      <div id="theme-list"></div>
    </div>
    <div class="field">
      <button class="btn" onclick="document.getElementById('wcpt-import-input').click()">Import .wcpt</button>
      <input type="file" id="wcpt-import-input" accept=".wcpt,.zip,.json" style="display:none" onchange="importTheme(this)">
      <div class="hint">Import a WCP theme collection file.</div>
    </div>
  </div>

</div>

<script type="module">
const INSTANCE_ID = "{{ instance_id }}";

function applyTheme(t){Object.entries(t).forEach(([k,v])=>document.documentElement.style.setProperty(k,v));}
window.parent.postMessage({type:'wcp:ready'},'*');
window.parent.postMessage({type:'wcp:request-theme'},'*');
// URL-fragment theme injection (used by wcp:open-window navigation)
(function(){const QK='com.doc.widgetcontextprotocol';const raw=new URLSearchParams(location.search).get(QK)||(location.hash.startsWith('#wcp-theme=')?location.hash.slice(11):null);if(!raw)return;try{const p=JSON.parse(atob(raw));applyTheme(p.vars||p);}catch{}})();

// ── Theme sync ──────────────────────────────────────────────────────────────
// Listen for wcp:theme from host. The host broadcasts themeId alongside vars
// (WCP 2.2.0+) so we can keep the radio button in sync with the dashboard's
// actual active theme — not just the locally-stored preference.
window.addEventListener('message', e => {
  if ((e.data?.type === 'wcp:theme' || e.data?.type === 'wcp:context') && (e.data.vars || e.data.theme)) {
    applyTheme(e.data.vars || e.data.theme);
    // Update radio selection when host tells us which theme is active
    const hostId = e.data.themeId;
    if (hostId && hostId !== _activeThemeId) {
      _activeThemeId = hostId;
      renderThemeList();
    }
  }
});

// ── Built-in themes (must match dashboard BUILTIN_THEMES exactly) ───────────
const BUILTIN_THEMES = [
  { id:'dark',  name:'Penrith Beacon WCP Dark',         builtin:true,
    vars:{'--wcp-color-bg':'#0d1117','--wcp-color-surface':'#161b22','--wcp-color-surface-raised':'#1c2128','--wcp-color-border':'#30363d','--wcp-color-text':'#e6edf3','--wcp-color-text-muted':'#8b949e','--wcp-color-primary':'#f0883e','--wcp-color-success':'#3fb950','--wcp-color-danger':'#f85149','--wcp-color-warning':'#d29922','--wcp-color-info':'#58a6ff','--wcp-radius-md':'8px','--wcp-shadow-sm':'0 4px 16px rgba(0,0,0,.45)'} },
  { id:'light', name:'Penrith Beacon WCP Light',        builtin:true,
    vars:{'--wcp-color-bg':'#ffffff','--wcp-color-surface':'#f6f8fa','--wcp-color-surface-raised':'#eaeef2','--wcp-color-border':'#d0d7de','--wcp-color-text':'#1f2328','--wcp-color-text-muted':'#636c76','--wcp-color-primary':'#f0883e','--wcp-color-success':'#1a7f37','--wcp-color-danger':'#cf222e','--wcp-color-warning':'#9a6700','--wcp-color-info':'#0969da','--wcp-radius-md':'8px','--wcp-shadow-sm':'0 4px 8px rgba(0,0,0,.12)'} },
  { id:'hc',    name:'Penrith Beacon WCP High Contrast',builtin:true,
    vars:{'--wcp-color-bg':'#000000','--wcp-color-surface':'#0d0d0d','--wcp-color-surface-raised':'#1a1a1a','--wcp-color-border':'#ffffff','--wcp-color-text':'#ffffff','--wcp-color-text-muted':'#cccccc','--wcp-color-primary':'#ff8c00','--wcp-color-success':'#00ff41','--wcp-color-danger':'#ff3333','--wcp-color-warning':'#ffff00','--wcp-color-info':'#00b4ff','--wcp-radius-md':'4px','--wcp-shadow-sm':'none'} },
];

let _customThemes  = [];
let _activeThemeId = 'dark';  // updated by wcp:theme hostId before first render

function getAllThemes() { return [...BUILTIN_THEMES, ..._customThemes]; }

let _pendingDelete = null, _pendingDeleteTimer = null;

function renderThemeList() {
  document.getElementById('theme-list').innerHTML = getAllThemes().map(t => {
    const active  = t.id === _activeThemeId || (t.uuid && t.uuid === _activeThemeId);
    const tid     = t.id || t.uuid;
    const pending = _pendingDelete === tid;
    const del = t.builtin ? '' :
      `<button class="btn" style="font-size:11px;padding:3px 9px;color:var(--wcp-color-danger);border-color:rgba(248,81,73,.3)${pending?';background:rgba(248,81,73,.12)':''}"
         onclick="event.stopPropagation();deleteTheme('${tid}')">${pending ? 'Sure?' : 'Delete'}</button>`;
    return `<div class="theme-list-item${active?' active-theme':''}" onclick="selectTheme('${tid}')">
      <input type="radio" name="active-theme" ${active?'checked':''} onchange="selectTheme('${tid}')" onclick="event.stopPropagation()">
      <span class="theme-name">${t.name}</span>
      ${t.builtin ? '<span class="theme-builtin-badge">Built-in</span>' : ''}
      ${del}
    </div>`;
  }).join('');
}

async function loadThemes() {
  try {
    const d = await fetch(`/widget/api/themes?wcpInstanceId=${INSTANCE_ID}`).then(r=>r.json());
    // Only use stored active if we haven't already been told by the host via wcp:theme
    if (_activeThemeId === 'dark') _activeThemeId = d.active || 'dark';
    _customThemes = d.custom || [];
  } catch {}
  renderThemeList();
}
loadThemes();

window.selectTheme = async function(id) {
  _activeThemeId = id;
  const t = getAllThemes().find(x => x.id===id || x.uuid===id);
  if (t) {
    applyTheme(t.vars);
    // Tell the host to adopt this theme
    if (window.top !== window) window.top.postMessage({type:'wcp:theme-apply', vars:t.vars}, '*');
  }
  renderThemeList();
  await fetch('/widget/configure', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({theme: id, wcpInstanceId: INSTANCE_ID})
  });
};

window.deleteTheme = async function(id) {
  if (_pendingDelete === id) {
    clearTimeout(_pendingDeleteTimer);
    _pendingDelete = null;
    _customThemes = _customThemes.filter(t => t.id !== id && t.uuid !== id);
    if (_activeThemeId === id) { _activeThemeId = 'dark'; applyTheme(BUILTIN_THEMES[0].vars); }
    await fetch(`/widget/api/themes/${encodeURIComponent(id)}`, {method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({wcpInstanceId:INSTANCE_ID})});
    renderThemeList();
  } else {
    _pendingDelete = id;
    renderThemeList();
    _pendingDeleteTimer = setTimeout(() => { _pendingDelete = null; renderThemeList(); }, 3000);
  }
};

// ── .wcpt import ────────────────────────────────────────────────────────────
window.importTheme = async function(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  try {
    const buf  = await file.arrayBuffer();
    const text = new TextDecoder().decode(buf);
    const pkg  = JSON.parse(text);
    const themes = pkg.themes || [pkg];
    let imported = 0;
    for (const t of themes) {
      if (!t.vars || !t.name) continue;
      const r = await fetch('/widget/api/themes/import', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({theme: t, wcpInstanceId: INSTANCE_ID})
      });
      const d = await r.json();
      if (d.success) { _customThemes.push(d.theme); imported++; }
    }
    if (imported) renderThemeList();
  } catch (err) { alert('Import failed: ' + err.message); }
};
</script>
</body>
</html>
